# Stages a new npm version when a GitHub release is published, using npm trusted publishing (OIDC)
# and staged publishing. No npm token is stored anywhere: npm trusts this workflow file in this repository.
# The version only goes live after the maintainer approves it on npmjs.com (2FA / security key).
# One-time setup on npmjs.com: package → Settings → Trusted Publisher → GitHub Actions,
# user "ppapajohn", repository "Homebridge-Siemens-RDS", workflow "release.yml", stage-only.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # lets GitHub issue the short-lived OIDC token npm checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check release tag matches package.json
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
          echo "VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      - name: Skip if this version is already on npm
        id: exists
        run: |
          if npm view "homebridge-siemens-rds@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION is already on npm; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Make sure npm supports staged publishing (11.15.0+)
        if: steps.exists.outputs.skip != 'true'
        run: npm install -g npm@latest && npm --version

      - name: Check the package loads
        if: steps.exists.outputs.skip != 'true'
        run: |
          npm ci --omit=dev
          node -e "require('./index.js')"
          npm pack --dry-run

      - name: Stage on npm (approve on npmjs.com to publish)
        if: steps.exists.outputs.skip != 'true'
        run: npm stage publish --access public
